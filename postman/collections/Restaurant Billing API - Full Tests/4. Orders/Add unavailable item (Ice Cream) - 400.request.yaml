$kind: http-request
name: Add unavailable item (Ice Cream) -> 400
url: "{{baseUrl}}/api/orders/{{orderId}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "menuItemId": "{{iceCreamId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
      pm.test("Mentions unavailable", () => pm.expect(pm.response.json().message).to.include("unavailable"));
    language: text/javascript
order: 9000

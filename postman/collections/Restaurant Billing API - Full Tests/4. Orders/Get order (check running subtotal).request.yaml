$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const o = pm.response.json().data;
      pm.test("runningSubtotal = 5x5000 + 34000 = 59000", () => pm.expect(o.runningSubtotal).to.eql(59000));
      pm.test("Table populated", () => pm.expect(o.table.number).to.eql(1));
    language: text/javascript
order: 20000

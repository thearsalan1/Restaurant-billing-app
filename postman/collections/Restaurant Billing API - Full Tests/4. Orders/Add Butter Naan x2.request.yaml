$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "menuItemId": "{{naanId}}",
      "quantity": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const o = pm.response.json().data;
      pm.test("1 row, qty 2", () => { pm.expect(o.items.length).to.eql(1); pm.expect(o.items[0].quantity).to.eql(2); });
      pm.collectionVariables.set("naanRowId", o.items[0]._id);
    language: text/javascript
order: 6000

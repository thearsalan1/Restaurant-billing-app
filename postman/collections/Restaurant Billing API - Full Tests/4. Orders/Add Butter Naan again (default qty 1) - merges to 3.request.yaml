$kind: http-request
name: Add Butter Naan again (default qty 1) -> merges to 3
url: "{{baseUrl}}/api/orders/{{orderId}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "menuItemId": "{{naanId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const o = pm.response.json().data;
      pm.test("Still 1 row, qty 3", () => { pm.expect(o.items.length).to.eql(1); pm.expect(o.items[0].quantity).to.eql(3); });
    language: text/javascript
order: 7000

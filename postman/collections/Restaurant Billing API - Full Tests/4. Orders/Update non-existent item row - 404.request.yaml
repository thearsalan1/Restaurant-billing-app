$kind: http-request
name: Update non-existent item row -> 404
url: "{{baseUrl}}/api/orders/{{orderId}}/items/{{fakeId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "quantity": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 16000

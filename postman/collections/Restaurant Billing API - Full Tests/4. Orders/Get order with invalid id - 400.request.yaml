$kind: http-request
name: Get order with invalid id -> 400
url: "{{baseUrl}}/api/orders/abc"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 22000

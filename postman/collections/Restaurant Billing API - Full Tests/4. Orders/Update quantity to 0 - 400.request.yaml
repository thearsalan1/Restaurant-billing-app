$kind: http-request
name: Update quantity to 0 -> 400
url: "{{baseUrl}}/api/orders/{{orderId}}/items/{{naanRowId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "quantity": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 15000

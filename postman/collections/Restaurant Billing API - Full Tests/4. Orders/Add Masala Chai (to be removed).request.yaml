$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "menuItemId": "{{chaiId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      const c = pm.response.json().data.items.find(i => i.name === "Masala Chai");
      pm.collectionVariables.set("chaiRowId", c._id);
    language: text/javascript
order: 17000

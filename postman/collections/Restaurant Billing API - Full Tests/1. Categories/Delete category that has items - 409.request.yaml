$kind: http-request
name: Delete category that has items -> 409
url: "{{baseUrl}}/api/categories/{{startersId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 7000

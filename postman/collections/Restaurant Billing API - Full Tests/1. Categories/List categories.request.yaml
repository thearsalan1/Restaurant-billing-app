$kind: http-request
url: "{{baseUrl}}/api/categories"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test("At least 6 categories", () => pm.expect(d.length).to.be.at.least(6));
      const s = d.find(c => c.name === "Starters");
      pm.test("Starters exists", () => pm.expect(s).to.exist);
      pm.collectionVariables.set("startersId", s._id);
    language: text/javascript
order: 1000

$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Salads"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Name is Salads", () => pm.expect(pm.response.json().data.name).to.eql("Salads"));
      pm.collectionVariables.set("newCategoryId", pm.response.json().data._id);
    language: text/javascript
order: 2000

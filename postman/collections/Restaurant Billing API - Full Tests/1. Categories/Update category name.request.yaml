$kind: http-request
url: "{{baseUrl}}/api/categories/{{newCategoryId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Fresh Salads"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Name updated", () => pm.expect(pm.response.json().data.name).to.eql("Fresh Salads"));
    language: text/javascript
order: 5000

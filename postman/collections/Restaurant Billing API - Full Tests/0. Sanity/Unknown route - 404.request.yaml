$kind: http-request
name: Unknown route -> 404
url: "{{baseUrl}}/api/abc"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 2000

$kind: http-request
url: "{{baseUrl}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("success is true", () => pm.expect(pm.response.json().success).to.eql(true));
    language: text/javascript
order: 1000

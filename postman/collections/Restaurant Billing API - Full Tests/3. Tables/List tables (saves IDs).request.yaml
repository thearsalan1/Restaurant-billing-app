$kind: http-request
url: "{{baseUrl}}/api/tables"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test("At least 8 tables", () => pm.expect(d.length).to.be.at.least(8));
      pm.test("Sorted by number", () => pm.expect(d[0].number).to.be.below(d[1].number));
      const t1 = d.find(t => t.number === 1), t2 = d.find(t => t.number === 2);
      pm.test("Table 1 is free with no current order", () => { pm.expect(t1.status).to.eql("FREE"); pm.expect(t1.currentOrder).to.eql(null); });
      pm.collectionVariables.set("tableId", t1._id);
      pm.collectionVariables.set("table2Id", t2._id);
    language: text/javascript
order: 1000

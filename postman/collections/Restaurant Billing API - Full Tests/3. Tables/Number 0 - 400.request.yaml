$kind: http-request
name: Number 0 -> 400
url: "{{baseUrl}}/api/tables"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "number": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 4000

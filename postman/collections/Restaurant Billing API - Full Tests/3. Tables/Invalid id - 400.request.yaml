$kind: http-request
name: Invalid id -> 400
url: "{{baseUrl}}/api/tables/abc"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "capacity": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 10000

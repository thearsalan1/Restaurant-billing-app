$kind: http-request
name: Add item to cancelled order -> 409
url: "{{baseUrl}}/api/orders/{{orderId2}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "menuItemId": "{{naanId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 3000

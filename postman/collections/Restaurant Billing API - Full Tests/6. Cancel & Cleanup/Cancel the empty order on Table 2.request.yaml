$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId2}}/cancel"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("CANCELLED", () => pm.expect(pm.response.json().data.status).to.eql("CANCELLED"));
    language: text/javascript
order: 1000

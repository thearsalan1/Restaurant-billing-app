$kind: http-request
name: "Generate bill: 10% discount"
url: "{{baseUrl}}/api/orders/{{orderId}}/bill"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "discountType": "PERCENT",
      "discountValue": 10
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const o = pm.response.json().data;
      pm.test("billedAt is set", () => pm.expect(o.billedAt).to.exist);
      pm.test("subtotal 59000", () => pm.expect(o.subtotal).to.eql(59000));
      pm.test("discountAmount 5900", () => pm.expect(o.discountAmount).to.eql(5900));
      pm.test("taxAmount 2655", () => pm.expect(o.taxAmount).to.eql(2655));
      pm.test("total 55755", () => pm.expect(o.total).to.eql(55755));
      pm.test("Tax rate snapshot saved", () => pm.expect(o.taxRate).to.be.a("number"));
      pm.test("Still OPEN until paid", () => pm.expect(o.status).to.eql("OPEN"));
    language: text/javascript
order: 11000

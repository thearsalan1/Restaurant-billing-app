$kind: http-request
name: Pay again (double payment) -> 409
url: "{{baseUrl}}/api/orders/{{orderId}}/pay"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "paymentMethod": "CASH"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 18000

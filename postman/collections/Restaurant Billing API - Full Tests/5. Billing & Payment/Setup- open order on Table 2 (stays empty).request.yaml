$kind: http-request
name: "Setup: open order on Table 2 (stays empty)"
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tableId": "{{table2Id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("orderId2", pm.response.json().data._id);
    language: text/javascript
order: 1000

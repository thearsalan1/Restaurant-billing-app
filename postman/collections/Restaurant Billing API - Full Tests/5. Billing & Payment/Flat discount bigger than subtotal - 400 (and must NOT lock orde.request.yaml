$kind: http-request
name: Flat discount bigger than subtotal -> 400 (and must NOT lock order)
url: "{{baseUrl}}/api/orders/{{orderId}}/bill"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "discountType": "FLAT",
      "discountValue": 99999999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 8000

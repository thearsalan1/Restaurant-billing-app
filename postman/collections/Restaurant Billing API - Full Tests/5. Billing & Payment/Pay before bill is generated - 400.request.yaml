$kind: http-request
name: Pay before bill is generated -> 400
url: "{{baseUrl}}/api/orders/{{orderId}}/pay"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "paymentMethod": "CASH"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 3000

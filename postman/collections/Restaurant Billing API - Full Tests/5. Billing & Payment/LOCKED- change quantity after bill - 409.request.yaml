$kind: http-request
name: "LOCKED: change quantity after bill -> 409"
url: "{{baseUrl}}/api/orders/{{orderId}}/items/{{naanRowId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 13000

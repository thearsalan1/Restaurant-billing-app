$kind: http-request
name: Delete same item again -> 404
url: "{{baseUrl}}/api/menu/{{newMenuItemId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 18000

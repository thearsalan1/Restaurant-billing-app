$kind: http-request
name: "Filter: veg=true"
url: "{{baseUrl}}/api/menu?veg=true"
method: GET
queryParams:
  veg: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test("All items are veg", () => pm.expect(d.every(i => i.isVeg === true)).to.be.true);
    language: text/javascript
order: 2000

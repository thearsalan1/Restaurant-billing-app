$kind: http-request
url: "{{baseUrl}}/api/menu"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test("At least 18 items", () => pm.expect(d.length).to.be.at.least(18));
      pm.test("Category is populated with name", () => pm.expect(d[0].category.name).to.be.a("string"));
      const id = n => { const x = d.find(i => i.name === n); pm.expect(x, n + " missing").to.exist; return x._id; };
      pm.collectionVariables.set("naanId", id("Butter Naan"));
      pm.collectionVariables.set("chickenId", id("Butter Chicken"));
      pm.collectionVariables.set("chaiId", id("Masala Chai"));
      pm.collectionVariables.set("iceCreamId", id("Ice Cream"));
    language: text/javascript
order: 1000

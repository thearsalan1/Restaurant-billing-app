$kind: http-request
name: Invalid query value -> 400
url: "{{baseUrl}}/api/menu?available=maybe"
method: GET
queryParams:
  available: maybe
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("success is false", () => pm.expect(pm.response.json().success).to.eql(false));
    language: text/javascript
order: 6000

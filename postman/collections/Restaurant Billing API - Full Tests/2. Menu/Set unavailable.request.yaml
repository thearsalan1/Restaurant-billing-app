$kind: http-request
url: "{{baseUrl}}/api/menu/{{newMenuItemId}}/availability"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isAvailable": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("isAvailable false", () => pm.expect(pm.response.json().data.isAvailable).to.eql(false));
    language: text/javascript
order: 14000

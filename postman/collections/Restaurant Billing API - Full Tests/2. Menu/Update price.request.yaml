$kind: http-request
url: "{{baseUrl}}/api/menu/{{newMenuItemId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "price": 27000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Price updated", () => pm.expect(pm.response.json().data.price).to.eql(27000));
    language: text/javascript
order: 13000
